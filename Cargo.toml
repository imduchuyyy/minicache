[package]
name = "shmcache"
version = "0.1.0"
description = "A lock-free cache in POSIX shared memory, shared across processes with no daemon"
homepage = "https://github.com/imduchuyyy/minicache"
repository = "https://github.com/imduchuyyy/minicache"
readme = "README.md"
keywords = ["cache", "shared-memory", "mmap", "ipc", "lock-free"]
categories = ["caching", "data-structures", "concurrency"]
license = "GPL-3.0-only"
edition = "2024"

[features]
# Builds the cross-process test worker. Not on by default, so `cargo install`
# does not put a test harness on the user's PATH.
_selftest = []

[[bin]]
name = "shm_worker"
path = "src/bin/shm_worker.rs"
required-features = ["_selftest"]

[dependencies]
bytes = "1.0"
libc = "0.2.189"
memmap2 = "0.9.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cache_bench"
harness = false

# Cargo only auto-discovers `examples/`, so the singular directory needs a path.
[[example]]
name = "hello"
path = "example/main.rs"
