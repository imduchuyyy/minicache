[package]
name = "minicache"
version = "0.1.0"
description = "An in-process cache, optionally shared between processes via mmap"
homepage = "https://github.com/imduchuyyy/minicache"
repository = "https://github.com/imduchuyyy/minicache"
readme = "README.md"
keywords = ["cache", "lru", "shared-memory", "mmap", "ipc"]
categories = ["caching", "data-structures", "concurrency"]
license-file = "LICENSE"
edition = "2024"

[dependencies]
bytes = "1.0"
libc = "0.2.189"
memmap2 = "0.9.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cache_bench"
harness = false

# Cargo only auto-discovers `examples/`, so the singular directory needs a path.
[[example]]
name = "hello"
path = "example/main.rs"
